<ng-container *transloco="let translate">
  <dialog
    #dialog
    class="m-auto w-[min(92vw,26rem)] rounded-panel border border-line bg-surface-raised p-0 text-ink shadow-2xl backdrop:bg-ink/45 backdrop:backdrop-blur-[2px]"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-body"
    (close)="onClose()"
  >
    @if (confirm.request(); as request) {
      <div class="px-7 pt-7 pb-6">
        <h2 id="confirm-title" class="font-display text-subtitle leading-tight text-ink">
          {{ translate(request.titleKey, request.params) }}
        </h2>
        <p id="confirm-body" class="mt-3 text-body-sm text-ink-muted">
          {{ translate(request.bodyKey, request.params) }}
        </p>
        <div class="mt-7 flex flex-col-reverse gap-2.5 sm:flex-row sm:justify-end sm:gap-3">
          <button
            type="button"
            class="button button--secondary button--compact"
            (click)="confirm.answer(false)"
          >
            {{ translate(t.dialog.cancel) }}
          </button>
          <button
            type="button"
            class="button button--compact"
            [class.button--danger]="request.danger"
            [class.button--primary]="!request.danger"
            (click)="confirm.answer(true)"
          >
            {{ translate(request.confirmKey) }}
          </button>
        </div>
      </div>
    }
  </dialog>
</ng-container>
