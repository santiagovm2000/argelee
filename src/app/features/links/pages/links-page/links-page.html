<ng-container *transloco="let translate">
  <section
    class="link-stage mx-auto flex w-full max-w-sm flex-col items-center justify-center px-6 py-12 text-center"
  >
    <arg-wordmark size="display" class="text-wordmark" />
    <div class="ornament mt-5 w-fit" aria-hidden="true"><span></span></div>
    <p class="mt-4 text-body-sm text-ink-muted">{{ translate(t.links.tagline) }}</p>

    <nav class="mt-10 flex w-full flex-col gap-3" [attr.aria-label]="translate(t.links.title)">
      <a
        [href]="order.chatUrl()"
        target="_blank"
        rel="noopener"
        class="button button--whatsapp button--tall w-full gap-3"
      >
        <svg class="size-5 shrink-0" aria-hidden="true">
          <use [attr.href]="icons.whatsapp" />
        </svg>
        {{ translate(t.links.whatsapp) }}
      </a>
      <a [routerLink]="language.homeUrl()" class="button button--primary button--tall w-full gap-3">
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path stroke-linecap="round" d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
        </svg>
        {{ translate(t.links.website) }}
      </a>
      <a
        [href]="site.catalogPdf"
        target="_blank"
        rel="noopener"
        class="button button--secondary button--tall w-full gap-3"
      >
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8l-5-5Zm0 0v5h5M9 13h6M9 17h6"
          />
        </svg>
        {{ translate(t.links.catalog) }}
      </a>
    </nav>
  </section>
</ng-container>
