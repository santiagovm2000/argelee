<ng-container *transloco="let translate">
  <section
    class="hero-stage water relative isolate -mt-header flex min-h-hero flex-col overflow-clip bg-surface pt-header text-ink"
  >
    <arg-caustics motion="depth" />
    <div
      class="hero-layout relative mx-auto flex w-full max-w-wide flex-1 flex-col gap-5 px-6 pb-15 sm:gap-8 sm:px-10 sm:pb-20 lg:grid lg:grid-cols-[1.05fr_0.95fr] lg:gap-x-12 lg:px-14 lg:pb-28"
    >
      <arg-bloom
        arrangement="column"
        class="depth-near pointer-events-none absolute bottom-16 -left-36 hidden w-44 lg:block"
      />
      <div class="max-w-xl self-start lg:pb-10">
        <div class="hero-mark-room" aria-hidden="true"></div>
        <h1 class="hero-title max-w-[15ch] pt-4 text-display text-ink sm:pt-6">
          {{ translate(t.landing.hero.headline) }}
        </h1>
        <p class="hero-lead mt-3 max-w-[44ch] text-body-sm text-ink sm:mt-5 sm:text-body-lg">
          {{ translate(t.landing.hero.body) }}
        </p>
        <div class="mt-5 flex flex-wrap gap-3 sm:mt-9">
          <a
            [routerLink]="language.homeUrl()"
            [fragment]="sections.catalog"
            class="button button--primary"
          >
            {{ translate(t.landing.hero.primaryAction) }}
          </a>
          <a
            [href]="order.chatUrl()"
            argLead="hero"
            target="_blank"
            rel="noopener"
            class="button button--secondary"
          >
            {{ translate(t.landing.hero.secondaryAction) }}
          </a>
        </div>
      </div>

      <div class="hero-lid-area lg:self-center">
        <div class="hero-lid relative mx-auto max-w-lid lg:w-full">
          <div
            class="relative aspect-square overflow-clip rounded-full border-8 border-neutral-0 bg-surface-hover shadow-overlay sm:border-12"
          >
            <img
              [ngSrc]="poster.path"
              fill
              [ngSrcset]="posterSrcset"
              priority
              [placeholder]="poster.placeholder"
              [sizes]="posterSizes"
              class="object-cover"
              alt=""
              aria-hidden="true"
            />
            <video
              #video
              class="hero-video absolute inset-0 size-full object-cover"
              muted
              loop
              playsinline
              preload="none"
              aria-hidden="true"
              tabindex="-1"
            >
              <source [src]="sources.webm" type="video/webm" />
              <source [src]="sources.mp4" type="video/mp4" />
            </video>
          </div>
          <arg-seal class="depth-turn absolute -bottom-2 -left-3 w-1/3 -rotate-12 drop-shadow-lg" />
          <arg-bloom
            arrangement="pair"
            class="pointer-events-none absolute -right-8 -bottom-8 w-5/12 sm:-right-14 sm:-bottom-10"
          />
        </div>
      </div>
    </div>
  </section>
</ng-container>
