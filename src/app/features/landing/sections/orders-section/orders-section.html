<ng-container *transloco="let translate">
  <section [id]="sections.orders" class="scroll-mt-anchor bg-surface px-6 py-24 sm:px-10 lg:py-32">
    <div class="mx-auto max-w-content">
      <h2 class="script text-script text-ink">
        {{ translate(t.landing.orders.title) }}
      </h2>

      <div class="mt-10 grid gap-6 lg:mt-14 lg:grid-cols-3 lg:gap-8">
        @for (group of groups; track group.id) {
          <div class="rounded-card bg-surface-tint p-6 lg:p-8">
            <h3 class="flex items-center gap-3.5 text-title text-ink">
              <span
                class="grid size-12 shrink-0 place-items-center rounded-full bg-surface-raised text-accent-text"
              >
                <svg class="size-6" aria-hidden="true">
                  <use [attr.href]="group.icon" />
                </svg>
              </span>
              {{ translate(group.titleKey) }}
            </h3>
            <ul class="mt-6 flex flex-col gap-4">
              @for (note of group.noteKeys; track note) {
                <li class="flex gap-3 text-body-sm text-ink-muted">
                  <span
                    class="mt-2.5 size-1.5 shrink-0 rounded-full bg-accent"
                    aria-hidden="true"
                  ></span>
                  <span>{{ translate(note) }}</span>
                </li>
              }
            </ul>
          </div>
        }
      </div>
    </div>
  </section>
</ng-container>
