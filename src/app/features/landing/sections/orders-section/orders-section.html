<ng-container *transloco="let translate">
  <section [id]="sections.orders" class="scroll-mt-anchor px-6 py-26 text-center sm:px-10 lg:py-30">
    <h2 class="mx-auto max-w-[24ch] font-display text-statement text-ink">
      {{ translate(t.landing.orders.title) }}
    </h2>

    <div class="mx-auto mt-12 grid max-w-5xl gap-10 text-left md:grid-cols-3 md:gap-8 lg:gap-12">
      @for (group of groups; track group.id) {
        <div>
          <h3 class="flex items-center gap-3 text-accent-text">
            <svg class="size-6 shrink-0" aria-hidden="true">
              <use [attr.href]="group.icon" />
            </svg>
            <span class="font-body text-eyebrow font-medium tracking-eyebrow uppercase">{{
              translate(group.titleKey)
            }}</span>
          </h3>
          <ul class="mt-4 border-t border-line-tint">
            @for (note of group.notes; track note) {
              <li class="border-b border-line-tint py-3 text-body-sm text-ink-muted">
                {{ translate(note) }}
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <a
      [href]="order.chatUrl()"
      argLead="orders"
      target="_blank"
      rel="noopener"
      class="button button--secondary mt-12"
    >
      {{ translate(t.landing.orders.action) }}
    </a>
  </section>
</ng-container>
