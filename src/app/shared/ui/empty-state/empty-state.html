<ng-container *transloco="let translate">
  <section class="mx-auto flex max-w-content flex-col items-start px-6 py-24 sm:px-10 lg:py-32">
    <svg class="size-16" [attr.viewBox]="daisy.viewBox" aria-hidden="true">
      <use [attr.href]="daisy.href" />
    </svg>
    <h1 class="script mt-6 max-w-[16ch] text-script text-ink">{{ translate(titleKey()) }}</h1>
    <p class="mt-6 max-w-[48ch] text-body-lg text-ink-muted">{{ translate(bodyKey()) }}</p>
    <a [routerLink]="link()" [fragment]="fragment()" class="button button--primary mt-10">
      {{ translate(actionKey()) }}
    </a>
  </section>
</ng-container>
