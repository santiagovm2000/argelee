<ng-container *transloco="let translate">
  <span
    class="grid size-sticker place-content-center rounded-full bg-sticker text-center text-sticker-ink shadow-raised"
  >
    <span class="text-caption leading-none font-bold">{{ translate(t.catalog.card.from) }}</span>
    <span class="mt-0.5 text-amount font-black">{{ price() }}</span>
    @if (byUnit()) {
      <span class="text-caption leading-none font-bold">{{ translate(t.catalog.card.each) }}</span>
    }
  </span>
</ng-container>
