<div class="min-w-0">
  <p class="text-eyebrow font-bold text-accent-text">{{ legend() }}</p>
  <ul class="mt-3 flex flex-wrap gap-2.5">
    @for (option of options(); track option.id) {
      <li
        class="inline-flex min-h-11 items-center gap-2.5 rounded-full border border-line-tint bg-surface-raised py-1.5 pr-4 pl-1.5 text-body-sm font-bold text-ink"
      >
        <span class="grid size-8 shrink-0 place-items-center rounded-full bg-surface-tint">
          <svg class="size-6" aria-hidden="true">
            <use [attr.href]="option.icon" />
          </svg>
        </span>
        {{ option.label }}
      </li>
    }
  </ul>
</div>
