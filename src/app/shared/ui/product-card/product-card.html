<ng-container *transloco="let translate">
  <a
    [routerLink]="link()"
    (click)="chosen.emit(product().id)"
    class="group block text-center outline-none focus-visible:ring-2 focus-visible:ring-focus-ring focus-visible:ring-offset-4 focus-visible:ring-offset-surface-tint"
  >
    <div
      [attr.data-piece]="piece()"
      class="parallax-window relative aspect-square overflow-hidden rounded-card border border-line-tint bg-surface-raised shadow-raised transition-[box-shadow,border-color] duration-settled group-hover:border-accent-text group-hover:shadow-overlay"
    >
      <svg
        class="parallax-window__backdrop absolute inset-0 size-full scale-125"
        aria-hidden="true"
      >
        <image
          [attr.href]="image().placeholder"
          width="100%"
          height="100%"
          preserveAspectRatio="xMidYMid slice"
        />
      </svg>
      <img
        [ngSrc]="image().path"
        fill
        [ngSrcset]="srcset()"
        [placeholder]="image().placeholder"
        [sizes]="sizes"
        class="parallax-window__image object-contain"
        [alt]="text().name"
      />
    </div>

    <div class="px-2 pt-4">
      <h3 class="font-display text-title text-ink">{{ text().name }}</h3>
      <p class="mt-2 text-caption text-ink-muted">{{ text().note }}</p>
      <p class="mt-3 text-eyebrow font-medium text-accent-text uppercase">
        @if (byUnit()) {
          {{ translate(t.catalog.card.unitPrice, { price: price() }) }}
        } @else {
          {{ translate(t.catalog.card.price, { price: price() }) }}
        }
        ·
        {{ translate(t.catalog.card.customize) }}
      </p>
    </div>
  </a>
</ng-container>
