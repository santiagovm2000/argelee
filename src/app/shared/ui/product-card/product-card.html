<ng-container *transloco="let translate">
  <a
    [routerLink]="link()"
    (click)="chosen.emit(product().id)"
    class="group relative block rounded-card bg-surface-raised p-3 pb-6 transition-shadow duration-settled outline-none hover:shadow-overlay focus-visible:ring-2 focus-visible:ring-focus-ring focus-visible:ring-offset-4 focus-visible:ring-offset-surface-tint"
  >
    <div
      [attr.data-piece]="piece()"
      class="parallax-window relative aspect-square overflow-hidden rounded-photo bg-surface-tint"
    >
      <svg
        class="parallax-window__backdrop absolute inset-0 size-full scale-125"
        aria-hidden="true"
      >
        <image
          [attr.href]="image().placeholder"
          width="100%"
          height="100%"
          preserveAspectRatio="xMidYMid slice"
        />
      </svg>
      <img
        [ngSrc]="image().path"
        fill
        [ngSrcset]="srcset()"
        [placeholder]="image().placeholder"
        [sizes]="sizes"
        class="parallax-window__image object-contain"
        [alt]="text().name"
      />
    </div>
    <arg-price-sticker
      class="absolute -top-2 -right-2 -rotate-8"
      [price]="price()"
      [byUnit]="byUnit()"
    />

    <div class="px-2.5 pt-5">
      <h3 class="text-title text-ink">{{ text().name }}</h3>
      <p class="mt-1.5 text-body-sm text-ink-muted">{{ text().note }}</p>
      <p
        class="mt-4 text-body-sm font-bold text-accent-text underline decoration-transparent decoration-2 underline-offset-4 transition-colors duration-quick group-hover:decoration-current"
      >
        {{ translate(t.catalog.card.customize) }}
      </p>
    </div>
  </a>
</ng-container>
