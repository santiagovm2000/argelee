<ng-container *transloco="let translate">
  <button
    type="button"
    class="duration-quick grid size-9 place-items-center rounded-control border border-line text-ink-muted transition-colors hover:border-line-strong hover:text-ink"
    [attr.aria-label]="
      theme.isDark() ? translate(t.a11y.switchToLightTheme) : translate(t.a11y.switchToDarkTheme)
    "
    [attr.aria-pressed]="theme.isDark()"
    (click)="theme.toggle()"
  >
    @if (theme.isDark()) {
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          stroke-linecap="round"
          d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"
        />
      </svg>
    } @else {
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"
        />
      </svg>
    }
  </button>
</ng-container>
