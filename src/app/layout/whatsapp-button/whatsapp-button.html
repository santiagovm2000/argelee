<ng-container *transloco="let translate">
  <a
    [href]="order.chatUrl()"
    argLead="widget"
    target="_blank"
    rel="noopener"
    class="fixed right-5 bottom-5 z-40 grid size-14 place-items-center rounded-full bg-whatsapp text-neutral-0 shadow-overlay transition-[translate,background-color] duration-settled hover:-translate-y-0.5 hover:bg-whatsapp-hover sm:right-8 sm:bottom-8"
    [attr.aria-label]="translate(t.a11y.openWhatsapp)"
  >
    <svg class="size-6" aria-hidden="true">
      <use [attr.href]="icons.whatsapp" />
    </svg>
  </a>
</ng-container>
