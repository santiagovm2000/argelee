<ng-container *transloco="let translate">
  <div
    class="flex h-11 items-stretch overflow-hidden rounded-control border border-current/30"
    role="group"
    [attr.aria-label]="translate(t.a11y.changeLanguage)"
  >
    @for (code of language.available; track code; let first = $first) {
      <a
        [routerLink]="language.alternates()[code]"
        [attr.hreflang]="code"
        [attr.aria-current]="language.current() === code ? 'true' : null"
        class="inline-flex items-center px-3.5 text-label font-medium text-current uppercase transition-[opacity,background-color] duration-quick hover:bg-current/12"
        [class.border-l]="!first"
        [class.border-current/30]="!first"
        [class.bg-current/12]="language.current() === code"
        [class.opacity-100]="language.current() === code"
        [class.opacity-55]="language.current() !== code"
        [class.hover:opacity-100]="language.current() !== code"
      >
        {{ code }}
        <span class="sr-only">{{ translate(labelKey(code)) }}</span>
      </a>
    }
  </div>
</ng-container>
