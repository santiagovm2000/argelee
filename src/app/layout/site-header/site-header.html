<ng-container *transloco="let translate">
  <header class="sticky top-0 z-40 border-b border-line bg-surface/85 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-content items-center justify-between gap-6 px-6">
      <a
        [routerLink]="links.home"
        class="font-display text-title font-semibold tracking-tight text-ink"
      >
        {{ site.name }}
      </a>

      <nav class="flex items-center gap-3" [attr.aria-label]="translate(t.a11y.mainNavigation)">
        <arg-language-switcher />
        <arg-theme-toggle />
      </nav>
    </div>
  </header>
</ng-container>
