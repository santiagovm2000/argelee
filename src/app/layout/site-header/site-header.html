<ng-container *transloco="let translate">
  <header class="topbar fixed inset-x-0 top-0 z-40">
    <div
      class="mx-auto flex h-header max-w-wide items-center justify-between gap-6 px-6 sm:px-10 lg:px-14"
    >
      <a [routerLink]="language.homeUrl()" class="topbar__mark rounded-control">
        <arg-wordmark class="w-28" />
      </a>

      <nav
        class="flex items-center gap-2 text-ink sm:gap-3"
        [attr.aria-label]="translate(t.a11y.mainNavigation)"
      >
        <a
          [routerLink]="language.homeUrl()"
          [fragment]="sections.catalog"
          class="hidden min-h-11 items-center rounded-full px-4 text-label font-bold transition-colors duration-quick hover:bg-current/10 sm:inline-flex"
        >
          {{ translate(t.navigation.catalog) }}
        </a>
        <a
          [routerLink]="language.homeUrl()"
          [fragment]="sections.orders"
          class="hidden min-h-11 items-center rounded-full px-4 text-label font-bold transition-colors duration-quick hover:bg-current/10 sm:inline-flex"
        >
          {{ translate(t.navigation.orders) }}
        </a>
        <arg-theme-toggle class="ml-1" />
      </nav>
    </div>
  </header>
</ng-container>
