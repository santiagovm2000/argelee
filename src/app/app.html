<!-- `*transloco` waits for the active language to load, then re-renders on switch. -->
<ng-container *transloco="let translate">
  <a
    [routerLink]="[]"
    fragment="main"
    class="sr-only rounded-control bg-accent px-4 py-2 text-accent-ink focus-visible:not-sr-only focus-visible:absolute focus-visible:top-4 focus-visible:left-4 focus-visible:z-50"
  >
    {{ translate(t.a11y.skipToContent) }}
  </a>

  <arg-site-header />

  <main id="main" class="min-h-dvh">
    <router-outlet />
  </main>

  <arg-site-footer />
</ng-container>
