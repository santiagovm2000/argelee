    <title>ArGeles</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Generated by `bun run favicon` from the wordmark font and the colour tokens. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Mirrors --surface in src/styles/base.css for each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e141a" />
  </head>
  <body>
    <arg-root></arg-root>
    <!-- Cloudflare Web Analytics (privacy-first, no cookies). The token identifies the
         argelees.com site in the dashboard; the CSP in public/_headers allows this origin. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "41fbec6698b74681a739d18f22fb012d"}'
    ></script>
  </body>
</html>
