# Publishes both Workers: the site (https://argelees.com, prerendered assets + a light
# script over KV and R2) and the admin panel (https://admin.argelees.com).
#
# Each Worker, its domains, bindings and response headers are declared in its
# wrangler.jsonc, so this job only builds and uploads. The catalogue itself never
# passes through git: the build pulls the owner's published document from KV.
# Secrets:
#   CLOUDFLARE_API_TOKEN   an "Edit Cloudflare Workers" token that can also read the CATALOG namespace
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the argelees.com zone
# The panel's own secrets (ADMIN_USER, ADMIN_PASSWORD_HASH, SESSION_SECRET,
# BROWSER_RENDERING_TOKEN) live in the Worker, set once with `wrangler secret put`.
name: Deploy to argelees.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://argelees.com
    env:
      SITE_ORIGIN: https://argelees.com
      SITE_INDEXABLE: 'true'
      SITE_IMAGE_TRANSFORMS: 'true'
      # catalog:pull runs on its own and again inside build, so wrangler needs these throughout.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      # build-config.generated.ts is git-ignored, and lint/test are type-aware and
      # import it, so it has to exist before any check runs.
      - run: bun run config

      # The build prerenders from the catalogue the owner has published in KV.
      - run: bun run catalog:pull

      # The same gates as `bun run verify`; its build is the one below.
      - run: bun run i18n:check
      - run: bun run contrast
      - run: bun run check:templates
      - run: bun run check:structure
      - run: bun run lint
      - run: bun run test

      - run: bun run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --config admin/wrangler.jsonc
